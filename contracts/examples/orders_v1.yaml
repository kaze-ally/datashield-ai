# contracts/examples/orders_v1.yaml
#
# Referenced by README_week3.md as the schema `drift_detection_config.yaml`
# should stay in sync with. If your real file already exists with this
# shape, you don't need this one — contract_loader.py just needs
# `contract_name`, `version`, and a `fields` list with `name`/`type`/
# `required`/(optional)`allowed_values` keys. Included here so
# schema_healer has something to heal against out of the box.

contract_name: orders_v1
version: 1
fields:
  - name: order_id
    type: string
    required: true
  - name: order_total
    type: float
    required: true
  - name: payment_method
    type: string
    required: true
    allowed_values: [card, paypal, cod, credit_card, debit_card, gift_card]
  - name: currency
    type: string
    required: false
    allowed_values: [USD, EUR, GBP, INR]
  - name: customer_id
    type: string
    required: false
    pii: true
    masking_strategy: hash
  - name: customer_segment
    type: string
    required: false
    allowed_values: [new, returning, vip]
  - name: region
    type: string
    required: false
    allowed_values: [NA, EU, APAC, LATAM]
  - name: product_category
    type: string
    required: false
    allowed_values: [electronics, apparel, home]
  - name: item_count
    type: int
    required: false
  - name: unit_price
    type: float
    required: false
  - name: discount_pct
    type: float
    required: false
  - name: shipping_method
    type: string
    required: false
    allowed_values: [standard, express, overnight]
  - name: shipping_cost
    type: float
    required: false
  - name: shipping_country
    type: string
    required: false
    allowed_values: [IN, US, UK]
  - name: device_type
    type: string
    required: false
    allowed_values: [mobile, desktop, tablet]
  - name: order_channel
    type: string
    required: false
    allowed_values: [web, app, marketplace]
  - name: is_first_purchase
    type: boolean
    required: false
  - name: loyalty_tier
    type: string
    required: false
    allowed_values: [bronze, silver, gold, platinum]
  - name: warehouse_id
    type: string
    required: false
  - name: order_timestamp
    type: timestamp
    required: false
quality_rules:
  - rule: range_check
    field: order_total
    min: 0
    max: 100000
  - rule: range_check
    field: item_count
    min: 1
    max: 500
  - rule: range_check
    field: unit_price
    min: 0
    max: 100000
  - rule: range_check
    field: discount_pct
    min: 0
    max: 1
  - rule: range_check
    field: shipping_cost
    min: 0
    max: 10000
