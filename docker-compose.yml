# =============================================================================
# DataShield AI — Local Production-Grade Environment (100% free/open-source)
# =============================================================================
# Core infra : Zookeeper, Kafka, Postgres (pgvector), Airflow (LocalExecutor)
# Dev tooling: Kafka UI
# LLM backend: Ollama, self-hosted, zero API cost — see services/llm_gateway
# New features:
#   - llm-gateway : FrugalGPT-style cascade + semantic cache, backed by Ollama
#   - ai-catalog  : OpenLineage-driven, LLM-enriched automated data catalog
#   - dashboard   : Streamlit health/observability UI
#   - schema_healer : Week 5 — LLM-assisted schema evolution (Paper 8)
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_AIRFLOW_PASSWORD:-airflow}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-changeme-local-secret}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    POSTGRES_APP_DSN: postgresql+psycopg2://datashield:${POSTGRES_APP_PASSWORD:-datashield}@postgres:5432/datashield
    LLM_GATEWAY_URL: http://llm-gateway:8000
    AI_CATALOG_URL: http://ai-catalog:8000
    _PIP_ADDITIONAL_REQUIREMENTS: ${AIRFLOW_ADDITIONAL_REQUIREMENTS:-dag-factory==1.1.0 kafka-python==2.0.2 requests==2.32.3}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./contracts:/opt/airflow/contracts
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  networks:
    - datashield-net

services:
  # ---------------------------------------------------------------------------
  # Streaming backbone
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: datashield-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,srvr"
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_log:/var/lib/zookeeper/log
    networks:
      - datashield-net
    healthcheck:
      # FIX (2026-09-23, full-stack validation): "ruok" was unreliable on
      # this image/version — switched to "srvr", which reports a Mode
      # line (standalone/leader/follower) whenever ZK is actually serving,
      # and was confirmed working live. Needs "srvr" added to the 4LW
      # whitelist above, not just "ruok".
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: datashield-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092" # host access, e.g. for local scripts/notebooks
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - datashield-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: datashield-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/topics.sh:/scripts/topics.sh:ro
    entrypoint: ["bash", "/scripts/topics.sh"]
    networks:
      - datashield-net
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: datashield-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: datashield
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - datashield-net

  # ---------------------------------------------------------------------------
  # Persistence (pgvector-enabled: powers Airflow metadata + app catalog/cache)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: datashield-postgres
    environment:
      POSTGRES_USER: samar
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-password}
      POSTGRES_DB: postgres
      DS_AIRFLOW_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD:-password}
      DS_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-password}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - datashield-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Orchestration
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: datashield-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname DataShield \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
        airflow connections get sidecar_validator_api >/dev/null 2>&1 || \
          airflow connections add sidecar_validator_api --conn-type http --conn-schema http --conn-host sidecar-validator --conn-port 8000
        airflow connections get drift_monitor_api >/dev/null 2>&1 || \
          airflow connections add drift_monitor_api --conn-type http --conn-schema http --conn-host drift_monitor --conn-port 8000
        airflow connections get ai_catalog_api >/dev/null 2>&1 || \
          airflow connections add ai_catalog_api --conn-type http --conn-schema http --conn-host ai-catalog --conn-port 8000
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: datashield-airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_HOST_PORT:-18080}:8080"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: datashield-airflow-scheduler
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Week 3 — Drift Monitor (checks validated_orders against a rolling reference)
  # ---------------------------------------------------------------------------
  drift_monitor:
    build: ./services/drift_monitor
    container_name: drift_monitor
    environment:
      DATASHIELD_POSTGRES_DSN: postgresql://datashield:${POSTGRES_APP_PASSWORD:-datashield}@postgres:5432/datashield
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DRIFT_CONFIG_PATH: /app/config/drift_detection_config.yaml
    ports:
      - "8010:8000"
    volumes:
      - drift-reports:/app/reports/drift
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - datashield-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Week 4 — Remediation Circuit Breaker (Paper 7)
  # Consumes drift-events; gates remediation-requests vs remediation-dlq via a
  # CLOSED/OPEN/HALF_OPEN state machine with equal-jitter backoff.
  # ---------------------------------------------------------------------------
  circuit_breaker:
    build: ./services/circuit_breaker
    container_name: circuit_breaker
    environment:
      DATASHIELD_POSTGRES_DSN: postgresql://datashield:${POSTGRES_APP_PASSWORD:-datashield}@postgres:5432/datashield
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BREAKER_CONFIG_PATH: /app/config/circuit_breaker_config.yaml
    ports:
      - "8020:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - datashield-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Week 4 (part 2) — RCA Copilot (Paper 6)
  # Consumes remediation-requests, diagnoses via Ollama, reports back to
  # circuit_breaker's /report-outcome to advance HALF_OPEN -> CLOSED/OPEN.
  # ---------------------------------------------------------------------------
  rca_copilot:
    build: ./services/rca_copilot
    container_name: rca_copilot
    environment:
      DATASHIELD_POSTGRES_DSN: postgresql://datashield:${POSTGRES_APP_PASSWORD:-datashield}@postgres:5432/datashield
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RCA_CONFIG_PATH: /app/config/rca_copilot_config.yaml
    ports:
      - "8030:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - datashield-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Week 5 — LLM-Assisted Schema Evolution / Schema Healer (Paper 8)
  # Consumes schema-events (schema_mismatch subtype); heals via a closed JSON
  # mapping-op vocabulary proposed by the LLM (never raw code — see
  # healer/mapping_ops.py), re-validates against the same contract, and
  # publishes to validated-data on success or dead-letter-queue on failure.
  # ---------------------------------------------------------------------------
  schema_healer:
    build: ./services/schema_healer
    container_name: schema_healer
    environment:
      DATASHIELD_POSTGRES_DSN: postgresql://datashield:${POSTGRES_APP_PASSWORD:-datashield}@postgres:5432/datashield
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_HEALER_CONFIG_PATH: /app/config/schema_healer_config.yaml
    ports:
      - "8040:8000"
    volumes:
      - ./contracts:/app/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - datashield-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # NEW — Free, self-hosted LLM backend (replaces the paid Anthropic API calls)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.18.0
    container_name: datashield-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"   # local dev convenience only — never expose this publicly, Ollama has no auth
    environment:
      OLLAMA_MAX_LOADED_MODELS: 2
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_KEEP_ALIVE: 30m   # keep models warm between requests instead of unloading
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - datashield-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  ollama-init:
    image: ollama/ollama:0.18.0
    container_name: datashield-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_CHEAP_MODEL: ${LLM_CHEAP_MODEL:-phi4-mini}
      LLM_STRONG_MODEL: ${LLM_STRONG_MODEL:-llama3.1:8b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[ollama-init] pulling ${LLM_CHEAP_MODEL} (cheap tier)..."
        ollama pull "${LLM_CHEAP_MODEL}"
        echo "[ollama-init] pulling ${LLM_STRONG_MODEL} (strong tier)..."
        ollama pull "${LLM_STRONG_MODEL}"
        echo "[ollama-init] both models ready."
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - datashield-net
    restart: "no"

  # ---------------------------------------------------------------------------
  # Innovation #2: LLM cost-optimization gateway
  # (semantic cache + cheap->strong model cascade, now $0/token via Ollama)
  # ---------------------------------------------------------------------------
  llm-gateway:
    build: ./services/llm_gateway
    container_name: datashield-llm-gateway
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHEAP_MODEL: ${LLM_CHEAP_MODEL:-phi4-mini}
      STRONG_MODEL: ${LLM_STRONG_MODEL:-llama3.1:8b}
      POSTGRES_APP_DSN: postgresql://datashield:${POSTGRES_APP_PASSWORD:-datashield}@postgres:5432/datashield
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.94}
    ports:
      - "8090:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - datashield-net

  # ---------------------------------------------------------------------------
  # NEW — Innovation #3: AI-enriched, lineage-driven data catalog
  # ---------------------------------------------------------------------------
  ai-catalog:
    build: ./services/ai_catalog
    container_name: datashield-ai-catalog
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LINEAGE_TOPIC: openlineage-events
      SCHEMA_TOPIC: schema-events
      POSTGRES_APP_DSN: postgresql://datashield:${POSTGRES_APP_PASSWORD:-datashield}@postgres:5432/datashield
      LLM_GATEWAY_URL: http://llm-gateway:8000
    ports:
      - "8091:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - datashield-net

  # ---------------------------------------------------------------------------
  # Week 2 — Sidecar Data Contract Validator (Paper 9, WAP audit stage)
  # ---------------------------------------------------------------------------
  sidecar-validator:
    build: ./services/sidecar_validator
    container_name: datashield-sidecar-validator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_APP_DSN: postgresql://datashield:${POSTGRES_APP_PASSWORD:-datashield}@postgres:5432/datashield
      CONTRACTS_DIR: /app/contracts
      SCHEMA_EVENTS_TOPIC: schema-events
      DLQ_TOPIC_DEFAULT: dead-letter-queue
    volumes:
      - ./contracts:/app/contracts:ro
    ports:
      - "8092:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - datashield-net

  # ---------------------------------------------------------------------------
  # Week 2 — Streaming Isolation Forest anomaly detector (Papers 1 & 3)
  # ---------------------------------------------------------------------------
  ml-isolation-forest:
    build: ./services/ml_isolation_forest
    container_name: datashield-ml-isolation-forest
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_APP_DSN: postgresql://datashield:${POSTGRES_APP_PASSWORD:-datashield}@postgres:5432/datashield
      SOURCE_TOPIC: validated-data
      ANOMALY_TOPIC: anomaly-alerts
      MODEL_DIR: /app/models
      MIN_BOOTSTRAP_SAMPLES: ${IF_MIN_BOOTSTRAP_SAMPLES:-50}
      RETRAIN_WINDOW_SIZE: ${IF_RETRAIN_WINDOW_SIZE:-2000}
    volumes:
      - ml_models:/app/models
    ports:
      - "8093:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - datashield-net

  # ---------------------------------------------------------------------------
  # Streamlit observability dashboard
  # ---------------------------------------------------------------------------
  dashboard:
    build: ./services/dashboard
    container_name: datashield-dashboard
    environment:
      POSTGRES_APP_DSN: postgresql://datashield:${POSTGRES_APP_PASSWORD:-datashield}@postgres:5432/datashield
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LLM_GATEWAY_URL: http://llm-gateway:8000
      AI_CATALOG_URL: http://ai-catalog:8000
      ML_ISOLATION_FOREST_URL: http://ml-isolation-forest:8000
      AIRFLOW_URL: http://airflow-webserver:8080
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - datashield-net

networks:
  datashield-net:
    driver: bridge

volumes:
  pg_data:
  zk_data:
  zk_log:
  kafka_data:
  ollama_data:
  ml_models:
  drift-reports:
